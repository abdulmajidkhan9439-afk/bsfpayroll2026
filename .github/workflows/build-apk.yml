name: 📱 Build Android APK

on:
  push:
    branches: [claude/calorie-tracker-app-42Uwl]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Code download karein
        uses: actions/checkout@v4

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calorie-tracker-app/package-lock.json

      - name: 📦 Dependencies install karein
        working-directory: calorie-tracker-app
        run: npm install

      - name: 🔧 EAS CLI install karein
        run: npm install -g eas-cli

      - name: 🏗️ APK build karein
        working-directory: calorie-tracker-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --output ./build.apk || true

      - name: 📤 APK upload karein (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: calorie-tracker-pakistan.apk
          path: calorie-tracker-app/build.apk
          if-no-files-found: warn
          retention-days: 30
